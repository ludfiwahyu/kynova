name: main-guard

on:
  pull_request:
    branches: [main]

jobs:
  only-from-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Allow only dev (and the release PR) as the source of a PR into main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            dev|release-please--*) ;;
            *)
              echo "Pull requests into main must come from dev (got: $HEAD_REF)"
              exit 1
              ;;
          esac
