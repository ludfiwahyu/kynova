# A test build on real Macs and Windows PCs: the .dmg (Apple Silicon and Intel in one) and
# the Windows portable .exe. Run it from the Actions tab; the files are under the run's
# Artifacts. Releases are built by release.yml.
#
# The apps are not signed. Signing needs an Apple Developer ID and a Windows code-signing
# certificate, given to electron-builder as secrets (see https://www.electron.build/code-signing).
name: Desktop app

on:
    workflow_dispatch:

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      script: desktop:mac
                    - os: windows-latest
                      script: desktop:win
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: npm
            - run: npm ci
            - run: npm test
            - run: npm run ${{ matrix.script }}
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: false
            - uses: actions/upload-artifact@v4
              with:
                  name: kynova-${{ runner.os }}
                  path: |
                      release/*.dmg
                      release/*.exe
